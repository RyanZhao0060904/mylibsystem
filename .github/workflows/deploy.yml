name: Deploy to GitHub Pages

# 触发条件：main 分支有 push 时自动构建并部署
on:
  push:
    branches: [main]

# 允许 workflow 推送 gh-pages 分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Node 环境（Vite 8 需要较新的 Node，用 22）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. 安装依赖（npm ci 依据 package-lock.json 精确安装，速度更快）
      - name: Install dependencies
        run: npm ci

      # 4. 构建：vue-tsc 类型检查 + vite 打包，产物输出到 dist/
      - name: Build
        run: npm run build

      # 5. 把 dist/ 推送到 gh-pages 分支，供 GitHub Pages 托管
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
